<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>다이나믹 메이커스 Dynamic Makers</title>
    <link rel="icon" href="{{LOGO}}">
    <link rel="stylesheet" href="dynamicmakers.css">
</head>
<body>
    <header id="topbar">
        <div class="brand">
            <img src="{{LOGO}}" alt="" class="logo">
            <div class="brand-text">
                <span class="product">다이나믹 메이커스</span>
                <span class="maker">RoboMakers · Dynamic Makers</span>
            </div>
        </div>

        <input id="project-name" class="project-name" type="text" value="새 프로그램" aria-label="프로그램 이름">

        <nav class="file-buttons">
            <button id="new" class="tb-btn">새로 만들기</button>
            <button id="open" class="tb-btn">열기</button>
            <button id="save" class="tb-btn">저장</button>
            <button id="save-py" class="tb-btn" title="Python 코드를 .py 파일로 저장">.py 저장</button>
        </nav>

        <div class="spacer"></div>

        <div class="view-switch" role="tablist" aria-label="오른쪽 화면">
            <button id="view-python" class="view-btn active" role="tab">Python</button>
            <button id="view-monitor" class="view-btn" role="tab">모니터</button>
            <button id="view-teach" class="view-btn" role="tab" title="손으로 자세를 가르치고 재생합니다">가르치기</button>
            <button id="view-ai" class="view-btn" role="tab" title="카메라·소리·센서로 AI를 학습시킵니다">AI 학습</button>
        </div>

        <div class="connection">
            <span id="status" class="status" data-state="idle">연결 안 됨</span>
            <button id="connect-usb" class="tb-btn tb-outline">USB 연결</button>
            <button id="connect-ble" class="tb-btn tb-outline">블루투스 연결</button>
            <button id="connect-sim" class="tb-btn tb-outline tb-sim" title="로봇 없이 프로그램을 시험합니다">가상 로봇</button>
            <button id="disconnect" class="tb-btn tb-outline" hidden>연결 끊기</button>
        </div>

        <div class="run-buttons">
            <button id="run" class="run" title="실행 (초록 깃발)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg>
                <span>실행</span>
            </button>
            <button id="stop" class="stop" title="모두 멈추기">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
                <span>정지</span>
            </button>
        </div>
    </header>

    <main id="main">
        <div id="blocks"></div>
        <aside id="python"></aside>
        <aside id="monitor" hidden></aside>
        <aside id="teach" class="side-panel" hidden></aside>
        <aside id="ai" class="side-panel" hidden></aside>
    </main>

    <footer id="console">
        <div class="console-header">
            <button id="console-toggle" class="console-title">출력</button>
            <span class="console-hint">'말하기' 블록과 연결 상태가 여기에 표시됩니다</span>
            <button id="console-clear" class="console-clear">지우기</button>
        </div>
        <div id="console-lines"></div>
    </footer>

    <script src="{{VM_SRC}}"></script>
    <script type="module" src="dynamicmakers.js"></script>
</body>
</html>
